<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fiable Admin Login</title>

  <link rel="stylesheet" href="admin-login.css">
</head>

<body>

  <main class="admin-login-page">

    <section class="admin-login-card">

      <div class="admin-login-brand">
        <a href="index.html">
          <img src="images/Logo2.png" alt="Fiable Logistics">
        </a>
      </div>

      <div class="admin-login-heading">
        <span class="eyebrow">FIABLE LOGISTICS</span>

        <h1>Admin Portal</h1>

        <p>
          Sign in to manage Fiable operations.
        </p>
      </div>


      <form id="adminLoginForm" novalidate>

        <div class="form-group">

          <label for="adminEmail">
            Email
          </label>

          <input
            type="email"
            id="adminEmail"
            name="email"
            placeholder="admin@fiablelogistics.com"
            autocomplete="username"
            required
          >

        </div>


        <div class="form-group">

          <label for="adminPassword">
            Password
          </label>

          <div class="password-field">

            <input
              type="password"
              id="adminPassword"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="adminPasswordToggle"
            >
              Show
            </button>

          </div>

        </div>


        <div
          id="adminLoginError"
          class="admin-login-error"
          role="alert"
          aria-live="polite"
        ></div>


        <button
          type="submit"
          class="admin-login-btn"
          id="adminLoginBtn"
        >
          Log in
        </button>

      </form>


      <div class="admin-login-footer">

        <a href="index.html">
          ← Back to website
        </a>

      </div>

    </section>

  </main>


  <script src="admin-login.js"></script>

</body>
</html>
