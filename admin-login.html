<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fiable Admin Login</title>

  <link rel="stylesheet" href="admin-login.css">
</head>

<body>

  <main class="admin-login-page">

    <section class="admin-login-card">

      <div class="admin-login-brand">
        <a href="index.html">
          <img src="images/Logo2.png" alt="Fiable Logistics">
        </a>
      </div>

      <div class="admin-login-heading">
        <span class="eyebrow">FIABLE LOGISTICS</span>

        <h1>Admin Portal</h1>

        <p>
          Sign in to manage Fiable operations.
        </p>
      </div>


      <form id="adminLoginForm" novalidate>

        <div class="form-group">

          <label for="adminEmail">
            Email
          </label>

          <input
            type="email"
            id="adminEmail"
            name="email"
            placeholder="admin@fiablelogistics.com"
            autocomplete="username"
            required
          >

        </div>


        <div class="form-group">

          <label for="adminPassword">
            Password
          </label>

          <div class="password-field">

            <input
              type="password"
              id="adminPassword"
              name="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="password-toggle"
              id="adminPasswordToggle"
            >
              Show
            </button>

          </div>

        </div>


        <div
          id="adminLoginError"
          class="admin-login-error"
          role="alert"
          aria-live="polite"
        ></div>


        <button
          type="submit"
          class="admin-login-btn"
          id="adminLoginBtn"
        >
          Log in
        </button>

        <button
          type="button"
          class="admin-forgot-btn"
          id="adminForgotBtn"
        >
          Forgot your password?
        </button>

      </form>


      <form id="adminForgotForm" class="admin-form hidden" novalidate>

        <h2>Reset your password</h2>

        <p class="admin-form-info">
          Enter your admin email and we'll send you a secure password reset link.
        </p>

        <div class="form-group">
          <label for="adminForgotEmail">Email address</label>
          <input
            type="email"
            id="adminForgotEmail"
            placeholder="admin@fiablelogistics.com"
            required
          >
        </div>

        <div
          id="adminForgotError"
          class="admin-login-error"
          role="alert"
          aria-live="polite"
        ></div>

        <button
          type="submit"
          class="admin-login-btn"
          id="adminForgotSubmitBtn"
        >
          Send reset link
        </button>

        <button
          type="button"
          class="admin-back-btn"
          id="adminBackToLoginBtn"
        >
          ← Back to login
        </button>

      </form>


      <form id="adminResetForm" class="admin-form hidden" novalidate>

        <h2>Create a new password</h2>

        <p class="admin-form-info">
          Enter a new password for your admin account.
        </p>

        <div class="form-group">
          <label for="adminResetPassword">New password</label>
          <div class="password-field">
            <input
              type="password"
              id="adminResetPassword"
              placeholder="Enter your new password"
              minlength="8"
              required
            >
            <button
              type="button"
              class="password-toggle"
              id="adminResetPasswordToggle"
            >
              Show
            </button>
          </div>
        </div>

        <div class="form-group">
          <label for="adminResetConfirmPassword">Confirm new password</label>
          <div class="password-field">
            <input
              type="password"
              id="adminResetConfirmPassword"
              placeholder="Confirm your new password"
              minlength="8"
              required
            >
            <button
              type="button"
              class="password-toggle"
              id="adminResetConfirmPasswordToggle"
            >
              Show
            </button>
          </div>
        </div>

        <div
          id="adminResetError"
          class="admin-login-error"
          role="alert"
          aria-live="polite"
        ></div>

        <button
          type="submit"
          class="admin-login-btn"
          id="adminResetSubmitBtn"
        >
          Reset password
        </button>

        <button
          type="button"
          class="admin-back-btn"
          id="adminResetBackBtn"
        >
          ← Back to login
        </button>

      </form>


      <div class="admin-login-footer">

        <a href="index.html">
          ← Back to website
        </a>

      </div>

    </section>

  </main>


  <script src="admin-login.js"></script>

</body>
</html>
