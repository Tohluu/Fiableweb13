# Review the paid service/database plans in Render before creating resources.
services:
  - type: web
    name: fiable
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -B -u server.py
    healthCheckPath: /api/health
    autoDeployTrigger: off
    numInstances: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: APP_ENV
        value: production
      - key: REQUIRE_DATABASE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: fiable-db
          property: connectionString
databases:
  - name: fiable-db
    databaseName: fiable
    user: fiable
    region: frankfurt
    plan: 0.1c-256mb
    postgresMajorVersion: "17"
    diskSizeGB: 5
    ipAllowList: [] # Internal connections only; add your IP for desktop admin/import.
